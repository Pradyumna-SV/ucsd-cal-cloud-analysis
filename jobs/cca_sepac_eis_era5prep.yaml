apiVersion: batch/v1
kind: Job
metadata:
  name: prad-cca-sepac-eis-era5prep
  namespace: climate-analytics
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: cca-sepac-era5prep-container
        image: pytorch/pytorch:2.6.0-cuda11.8-cudnn9-devel

        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OUT_DIR
          value: /workspace/results/cca_sepac_eis
        - name: CACHE_DIR
          value: /workspace/era5_cache/sepac
        - name: WORK_DIR
          value: /workspace/sepac_scratch
        - name: ERA5_PREP_ONLY
          value: "1"

        - name: WANDB_PROJECT
          value: "ucsd-cal-cloud-cca"
        - name: WANDB_RUN_NAME
          value: "sepac-eis-era5-prep"
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-prad-ccacloud
              key: api-key

        - name: SSH_HOST
          value: "ds-serv8.ucsd.edu"
        - name: SSH_PORT
          value: "31849"
        - name: SSH_USER
          value: "sukhanna"
        - name: SSH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ssh-secret-prad-nepac
              key: password

        - name: REMOTE_COORD_DIR
          value: "/data/climate-analytics-lab-shared/Satellite/Unsupervised/coordinates_data"
        - name: REMOTE_MYD06_DIR
          value: "/data/climate-analytics-lab-shared/Satellite/processed_test_data"
        - name: REMOTE_IMG_DIR
          value: "/data/climate-analytics-lab-shared/Satellite/Unsupervised/triplet_data"
        - name: REMOTE_TMP_DIR
          value: "/home/sukhanna/tmp/sepac_era5prep"
        - name: REMOTE_PYTHON
          value: "/home/sukhanna/miniconda3/bin/python"

        - name: REMOTE_N_FILES
          value: "100"
        - name: LAT_MIN
          value: "-40.0"
        - name: LAT_MAX
          value: "-20.0"
        - name: LON_MIN
          value: "-110.0"
        - name: LON_MAX
          value: "-70.0"
        - name: CF_THRESH
          value: "0.4"

        command: ["/bin/bash", "-c"]
        args:
          - |
            set -eo pipefail

            apt-get update -q && apt-get install -y -q git

            REPO_DIR=/workspace/repo
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/Pradyumna-SV/ucsd-cal-cloud-analysis $REPO_DIR
            else
              echo "Repo exists, pulling latest..."
              cd $REPO_DIR && git reset --hard HEAD && git pull origin master
            fi

            pip install --quiet \
              numpy pandas scipy scikit-learn \
              xarray zarr gcsfs \
              matplotlib \
              wandb \
              paramiko \
              netCDF4 \
              global-land-mask

            mkdir -p /workspace/results/cca_sepac_eis
            mkdir -p /workspace/sepac_scratch
            mkdir -p /workspace/era5_cache/sepac
            mkdir -p /workspace/logs

            {
              python3 $REPO_DIR/scripts/cca_nepac_eis.py
            } 2>&1 | tee "/workspace/logs/cca_sepac_eis_era5prep_$(hostname)_$(date +%Y%m%d_%H%M%S).log"

        resources:
          limits:
            cpu: "8"
            memory: "32Gi"
          requests:
            cpu: "8"
            memory: "32Gi"

        volumeMounts:
        - name: embeddings-storage
          mountPath: /workspace

      volumes:
      - name: embeddings-storage
        persistentVolumeClaim:
          claimName: prad-embeddings-5ti

      tolerations:
        - key: "nautilus.io/noceph"
          operator: Exists
          effect: NoSchedule
        - key: "nautilus.io/group"
          operator: Exists
          effect: NoSchedule
        - key: "kubernetes.io/arch"
          value: "amd64"
          operator: Equal
          effect: NoSchedule
