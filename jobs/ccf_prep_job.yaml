apiVersion: batch/v1
kind: Job
metadata:
  name: prad-ccf-prep
  namespace: climate-analytics
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: ccf-prep
        image: python:3.10-slim
        env:
        - name: PREP_ONLY
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TILES_PATH
          value: /workspace/nepac_scratch/nepac_tiles.npy
        - name: META_PATH
          value: /workspace/nepac_scratch/nepac_meta.npz
        - name: CCF_PATH
          value: /workspace/merra2_2011_CCF_anomalies.nc
        - name: OUT_DIR
          value: /workspace/results/ccf_pipeline
        - name: PREP_DIR
          value: /workspace/ccf_preprocessed
        - name: WANDB_PROJECT
          value: "ucsd-cal-cloud-cca"
        - name: WANDB_RUN_NAME
          value: "ccf-prep-nepac"
        - name: WANDB_MODE
          value: "online"
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-prad-ccacloud
              key: api-key
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -eo pipefail

            apt-get update -q && apt-get install -y -q git

            REPO_DIR=/tmp/repo
            rm -rf "$REPO_DIR"
            git clone --depth 1 https://github.com/Pradyumna-SV/ucsd-cal-cloud-analysis "$REPO_DIR"

            pip install --quiet numpy pandas xarray netCDF4 scipy wandb

            mkdir -p /workspace/ccf_preprocessed
            mkdir -p /workspace/results/ccf_pipeline
            mkdir -p /workspace/logs

            {
              python3 "$REPO_DIR/scripts/cca_ccf_pipeline.py"
            } 2>&1 | tee "/workspace/logs/ccf_prep_$(hostname)_$(date +%Y%m%d_%H%M%S).log"
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
          requests:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
        - name: embeddings-storage
          mountPath: /workspace
      volumes:
      - name: embeddings-storage
        persistentVolumeClaim:
          claimName: prad-embeddings-5ti
      tolerations:
        - key: "nautilus.io/noceph"
          operator: Exists
          effect: NoSchedule
        - key: "nautilus.io/group"
          operator: Exists
          effect: NoSchedule
        - key: "kubernetes.io/arch"
          value: "amd64"
          operator: Equal
          effect: NoSchedule