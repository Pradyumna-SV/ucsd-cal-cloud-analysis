apiVersion: batch/v1
kind: Job
metadata:
  name: prad-ccf-gpu
  namespace: climate-analytics
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: ccf-gpu
        image: pytorch/pytorch:2.6.0-cuda11.8-cudnn9-devel
        env:
        - name: PREP_ONLY
          value: "0"   # or omit
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: WANDB_PROJECT
          value: "ucsd-cal-cloud-cca"
        - name: WANDB_RUN_NAME
          value: "ccf-gpu-nepac"
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-prad-ccacloud
              key: api-key
        - name: SSH_PASSWORD   # not needed, but may be required by the script for other uses
          valueFrom:
            secretKeyRef:
              name: ssh-secret-prad-nepac
              key: password
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -eo pipefail
            apt-get update -q && apt-get install -y -q git
            git clone --depth 1 https://github.com/Pradyumna-SV/ucsd-cal-cloud-analysis /tmp/repo
            pip install --quiet \
              numpy pandas scipy scikit-learn \
              xarray zarr gcsfs \
              pytorch-lightning \
              matplotlib \
              wandb
            mkdir -p /workspace/results/ccf_pipeline
            python3 /tmp/repo/scripts/cca_ccf_pipeline.py
        resources:
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          requests:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: embeddings-storage
          mountPath: /workspace
      volumes:
      - name: embeddings-storage
        persistentVolumeClaim:
          claimName: prad-embeddings-5ti
      tolerations:
        - key: "nautilus.io/noceph"
          operator: Exists
          effect: NoSchedule
        - key: "nautilus.io/group"
          operator: Exists
          effect: NoSchedule
        - key: "kubernetes.io/arch"
          value: "amd64"
          operator: Equal
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A100-SXM4-80GB
                  - NVIDIA-A100-80GB-PCIe
                  - NVIDIA-RTX-A6000
                  - Quadro-RTX-8000
                  - NVIDIA-L40
                  - NVIDIA-A40
                  - Tesla-V100-SXM2-32GB
                  - NVIDIA-A10
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-RTX-A5000
                  - NVIDIA-TITAN-RTX
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - sphinx.sdstate.edu
                  - k8s-haosu-09.sdsc.optiputer.net
                  - node-2-3.sdsc.optiputer.net
                  - node-2-2.sdsc.optiputer.net
                  - node-1-1.sdsc.optiputer.net
                  - gp-engine.beocat.ksu.edu
                  - gpengine-uams.areon.net