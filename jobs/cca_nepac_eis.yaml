apiVersion: batch/v1
kind: Job
metadata:
  name: prad-cca-nepac-eis
  namespace: climate-analytics
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: cca-nepac-container
        image: pytorch/pytorch:2.6.0-cuda11.8-cudnn9-devel

        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OUT_DIR
          value: /workspace/results/cca_nepac_eis
        - name: CACHE_DIR
          value: /workspace/era5_cache/nepac
        - name: WORK_DIR
          value: /workspace/nepac_scratch
        - name: CHECKPOINT
          value: /workspace/vae_checkpoint/lightning_model_50_transform.pt

        - name: BIN_BY_CCA_SCORE
          value: "1"
        - name: REQUIRE_ERA5_CACHE
          value: "1"
        - name: MAKE_HERO_TRAVERSAL
          value: "1"
        - name: HERO_N_STEPS
          value: "7"
        - name: HERO_N_BASES
          value: "6"
        - name: MAKE_SST_HERO
          value: "0"
        - name: MAKE_PROTO_INTERP
          value: "1"
        - name: PROTO_N_STEPS
          value: "9"

        - name: WANDB_PROJECT
          value: "ucsd-cal-cloud-cca"
        - name: WANDB_RUN_NAME
          value: "nepac-eis-curated"
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-prad-ccacloud
              key: api-key

        # ── SSH config ───────────────────────────────────────────────────────
        - name: SSH_HOST
          value: "ds-serv8.ucsd.edu"
        - name: SSH_PORT
          value: "31849"
        - name: SSH_USER
          value: "sukhanna"
        - name: SSH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ssh-secret-prad-nepac
              key: password

        # ── Remote data paths — fill these in ───────────────────────────────
        - name: REMOTE_COORD_DIR
          value: "/data/climate-analytics-lab-shared/Satellite/Unsupervised/coordinates_data"
        - name: REMOTE_MYD06_DIR
          value: "/data/climate-analytics-lab-shared/Satellite/processed_test_data"
        - name: REMOTE_IMG_DIR
          value: "/data/climate-analytics-lab-shared/Satellite/Unsupervised/triplet_data"
        - name: REMOTE_TMP_DIR
          value: "/home/sukhanna/tmp"
        - name: REMOTE_PYTHON
          value: "/home/sukhanna/miniconda3/bin/python"

        # ── Tile filter params ───────────────────────────────────────────────
        - name: REMOTE_N_FILES
          value: "100"
        - name: LAT_MIN
          value: "20.0"
        - name: LAT_MAX
          value: "65.0"
        - name: LON_MIN
          value: "-180.0"
        - name: LON_MAX
          value: "-110.0"
        - name: CF_THRESH
          value: "0.4"

        # ── Analysis hyperparameters ─────────────────────────────────────────
        - name: N_PCA_VAE
          value: "50"
        - name: N_WALK_STEPS
          value: "9"
        - name: N_SAMPLES
          value: "3"
        - name: VAE_BATCH
          value: "64"

        command: ["/bin/bash", "-c"]
        args:
          - |
            set -eo pipefail

            apt-get update -q && apt-get install -y -q git

            REPO_DIR=/tmp/repo
            rm -rf "$REPO_DIR"
            git clone --depth 1 https://github.com/Pradyumna-SV/ucsd-cal-cloud-analysis "$REPO_DIR"

            pip install --quiet \
              numpy pandas scipy scikit-learn \
              xarray zarr gcsfs \
              pytorch-lightning \
              matplotlib \
              wandb \
              paramiko \
              netCDF4 \
              global-land-mask

            mkdir -p /workspace/results/cca_nepac_eis
            mkdir -p /workspace/nepac_scratch
            mkdir -p /workspace/logs

            {
              python3 $REPO_DIR/scripts/cca_nepac_eis.py
            } 2>&1 | tee "/workspace/logs/cca_nepac_eis_$(hostname)_$(date +%Y%m%d_%H%M%S).log"

        resources:
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          requests:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: embeddings-storage
          mountPath: /workspace

      volumes:
      - name: embeddings-storage
        persistentVolumeClaim:
          claimName: prad-embeddings-5ti

      tolerations:
        - key: "nautilus.io/noceph"
          operator: Exists
          effect: NoSchedule
        - key: "nautilus.io/group"
          operator: Exists
          effect: NoSchedule
        - key: "kubernetes.io/arch"
          value: "amd64"
          operator: Equal
          effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A100-SXM4-80GB
                  - NVIDIA-A100-80GB-PCIe
                  - NVIDIA-RTX-A6000
                  - Quadro-RTX-8000
                  - NVIDIA-L40
                  - NVIDIA-A40
                  - Tesla-V100-SXM2-32GB
                  - NVIDIA-A10
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-RTX-A5000
                  - NVIDIA-TITAN-RTX
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - sphinx.sdstate.edu
                  - k8s-haosu-09.sdsc.optiputer.net
                  - node-2-3.sdsc.optiputer.net
                  - node-2-2.sdsc.optiputer.net
                  - node-1-1.sdsc.optiputer.net
                  - gp-engine.beocat.ksu.edu
                  - gpengine-uams.areon.net
